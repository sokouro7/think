<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";

  /* ============ CONSTANTES ============ */
  var KEY = "notes.app.v1";
  var FKEY = "notes.app.folders.v1";
  var THEME_KEY = "notes.app.theme";
  var SUPABASE_URL = "https://hmjawhmnfpmwfwjggtej.supabase.co";
  var SUPABASE_KEY = "sb_publishable_s053alCHzj3f3PeTxbg6nQ_bt5bFL1o";

  var notes = [], folders = [], currentId = null;
  var activeEditor = null;
  var sb = null, session = null, pushTimer = null, syncing = false;

  var el = {
    notesList: document.getElementById("notesList"),
    editor: document.getElementById("editor"),
    docPane: document.getElementById("docPane"),
    boardPane: document.getElementById("boardPane"),
    mapPane: document.getElementById("mapPane"),
    mapCanvas: document.getElementById("mapCanvas"),
    branchBar: document.getElementById("branchBar"),
    outline: document.getElementById("outline"),
    outlineBtn: document.getElementById("outlineBtn"),
    title: document.getElementById("titleInput"),
    subtitle: document.getElementById("subtitleInput"),
    backlinks: document.getElementById("backlinks"),
    area: document.getElementById("editorArea"),
    welcome: document.getElementById("welcome"),
    search: document.getElementById("search"),
    scrim: document.getElementById("scrim"),
    syncDot: document.getElementById("syncDot"),
    account: document.getElementById("accountBar"),
    palette: document.getElementById("palette"),
    hlBtn: document.getElementById("hlBtn"),
    hlSwatch: document.getElementById("hlSwatch"),
    colorBtn: document.getElementById("colorBtn"),
    boardBtn: document.getElementById("boardBtn"),
    mapBtn: document.getElementById("mapBtn"),
    authOverlay: document.getElementById("authOverlay"),
    authEmail: document.getElementById("authEmail"),
    authSend: document.getElementById("authSend"),
    authMsg: document.getElementById("authMsg"),
    authSkip: document.getElementById("authSkip")
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function htmlToText(html){
    var d = document.createElement("div");
    d.innerHTML = html || "";
    return d.textContent || "";
  }
  function stripHtml(html){
    return htmlToText(html).replace(/\s+/g," ").trim();
  }
  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  /* ============ DONNEES ============ */

  function normalizeNodes(list){
    if(!Array.isArray(list)) return;
    for(var i = list.length - 1; i >= 0; i--){
      if(!list[i] || typeof list[i] !== "object") list.splice(i, 1);
    }
    list.forEach(function(n){
      if(!n.id) n.id = uid();
      if(typeof n.text !== "string") n.text = "";
      if(typeof n.collapsed !== "boolean") n.collapsed = false;
      if(!Array.isArray(n.children)) n.children = [];
      normalizeNodes(n.children);
    });
  }

  // Migration : reprend les notes des versions precedentes sans rien perdre.
  function migrate(arr){
    // une entree nulle ou d'un mauvais type ferait planter toute la suite
    arr = arr.filter(function(n){ return n && typeof n === "object" && !Array.isArray(n); });
    arr.forEach(function(n){
      if(n.doc == null){
        if(Array.isArray(n.cols)) n.doc = (n.cols[0]||"") + (n.cols[1]||"");
        else n.doc = n.html || "";
      }
      if(!Array.isArray(n.blocks)) n.blocks = [];
      n.blocks = n.blocks.filter(function(b){ return b && typeof b === "object"; });
      n.blocks.forEach(function(b){
        if(!b.id) b.id = uid();
        if(typeof b.html !== "string") b.html = "";
        if(typeof b.x !== "number") b.x = 40;
        if(typeof b.y !== "number") b.y = 40;
        if(typeof b.w !== "number") b.w = 260;
      });
      if(n.mode !== "board" && n.mode !== "map") n.mode = "doc";
      if(n.folderId === undefined) n.folderId = null;
      if(!n.created) n.created = Date.now();
      if(!n.updated) n.updated = n.created;
      if(!n.id) n.id = uid();
      // nouveaute : titre et sous-titre explicites, deduits de la premiere ligne
      if(typeof n.title !== "string" || !n.title){
        var first = noteText(n).split("\n")[0].slice(0,80).trim();
        n.title = first || "Sans titre";
      }
      if(typeof n.subtitle !== "string") n.subtitle = "";
      // nouveaute : carte mentale
      if(!n.map || !Array.isArray(n.map.children)) n.map = { children: [] };
      normalizeNodes(n.map.children);
      delete n.cols; delete n.ratio; delete n.html;
    });
    return arr;
  }

  function load(){
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch(e){}
    var arr = [];
    if(raw){ try { arr = JSON.parse(raw); } catch(e){ arr = []; } }
    if(!Array.isArray(arr)) arr = [];
    notes = migrate(arr);
    loadFolders();
  }

  function loadFolders(){
    var raw = null;
    try { raw = localStorage.getItem(FKEY); } catch(e){}
    var arr = [];
    if(raw){ try { arr = JSON.parse(raw); } catch(e){ arr = []; } }
    if(!Array.isArray(arr)) arr = [];
    arr = arr.filter(function(f){ return f && typeof f === "object" && !Array.isArray(f); });
    arr.forEach(function(f){
      if(!f.id) f.id = uid();
      if(typeof f.name !== "string") f.name = "Dossier";
      if(typeof f.collapsed !== "boolean") f.collapsed = false;
    });
    folders = arr;
  }

  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch(e){}
    scheduleCloudPush();
  }
  function persistFolders(){
    try { localStorage.setItem(FKEY, JSON.stringify(folders)); } catch(e){}
    scheduleCloudPush();
  }
  function saveLocalOnly(){
    try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch(e){}
    try { localStorage.setItem(FKEY, JSON.stringify(folders)); } catch(e){}
  }

  function current(){
    for(var i=0;i<notes.length;i++) if(notes[i].id === currentId) return notes[i];
    return null;
  }
  function touch(note){
    note.updated = Date.now();
    persist();
  }

  // Tout le texte d'une note, quel que soit son mode.
  function noteText(n){
    var parts = [stripHtml(n.doc)];
    (n.blocks||[]).forEach(function(b){ parts.push(stripHtml(b.html)); });
    (function walk(list){
      (list||[]).forEach(function(node){ parts.push(node.text); walk(node.children); });
    })(n.map && n.map.children ? n.map.children : []);
    return parts.filter(Boolean).join("\n");
  }

  /* ============ LIENS ENTRE NOTES ============
     Le contenu est toujours stocke en texte brut avec des #Titre.
     Les balises de lien sont visuelles et retirees avant chaque sauvegarde,
     ce qui evite toute imbrication en cascade.
  ========================================== */

  function unwrapLinks(root){
    var links = root.querySelectorAll("a.note-link");
    for(var i=0;i<links.length;i++){
      links[i].parentNode.replaceChild(document.createTextNode(links[i].textContent), links[i]);
    }
    root.normalize();
  }

  function knownTitles(){
    var seen = {}, list = [];
    notes.forEach(function(n){
      var t = (n.title||"").trim();
      if(t && !seen[t]){ seen[t] = 1; list.push(t); }
    });
    list.sort(function(a,b){ return b.length - a.length; });
    return list;
  }

  // Reconnait un lien a la position i. On teste les titres reels, le plus long
  // d'abord, pour que "#Notes de vente" gagne sur "#Notes".
  function matchLinkAt(text, i, titles){
    if(text.charAt(i) !== "#") return null;
    for(var t=0;t<titles.length;t++){
      var title = titles[t];
      if(text.substr(i+1, title.length).toLowerCase() === title.toLowerCase()){
        var after = text.charAt(i+1+title.length);
        if(after === "" || !/[A-Za-zÀ-ÿ0-9]/.test(after)){
          var found = null;
          for(var k=0;k<notes.length;k++){
            if((notes[k].title||"").trim().toLowerCase() === title.toLowerCase()){ found = notes[k]; break; }
          }
          return { text:"#"+title, length:title.length+1, id: found ? found.id : null };
        }
      }
    }
    var m = /^#([A-Za-zÀ-ÿ0-9_-]+)/.exec(text.slice(i));
    if(m) return { text:m[0], length:m[0].length, id:null };
    return null;
  }

  function renderLinksIn(root){
    if(!root) return;
    unwrapLinks(root);
    var titles = knownTitles();
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var nodes = [], node;
    while((node = walker.nextNode())) nodes.push(node);

    nodes.forEach(function(n){
      var text = n.textContent;
      if(text.indexOf("#") === -1) return;
      var frag = document.createDocumentFragment();
      var buffer = "", i = 0, found = false;
      while(i < text.length){
        var hit = matchLinkAt(text, i, titles);
        if(hit){
          found = true;
          if(buffer){ frag.appendChild(document.createTextNode(buffer)); buffer = ""; }
          var a = document.createElement("a");
          a.className = "note-link" + (hit.id ? "" : " broken");
          a.textContent = hit.text;
          if(hit.id) a.setAttribute("data-goto", hit.id);
          frag.appendChild(a);
          i += hit.length;
        } else { buffer += text.charAt(i); i++; }
      }
      if(!found) return;
      if(buffer) frag.appendChild(document.createTextNode(buffer));
      n.parentNode.replaceChild(frag, n);
    });
  }

  function plainHtml(root){
    var clone = root.cloneNode(true);
    unwrapLinks(clone);
    return clone.innerHTML;
  }

  function renderBacklinks(){
    var note = current();
    if(!note || !(note.title||"").trim()){ el.backlinks.className = "backlinks"; return; }
    var titles = knownTitles();

    var mentioning = notes.filter(function(n){
      if(n.id === note.id) return false;
      var text = noteText(n);
      for(var i=0;i<text.length;i++){
        var hit = matchLinkAt(text, i, titles);
        if(hit){
          if(hit.id === note.id) return true;
          i += hit.length - 1;
        }
      }
      return false;
    });

    if(!mentioning.length){ el.backlinks.className = "backlinks"; return; }
    el.backlinks.className = "backlinks on";
    el.backlinks.innerHTML = '<span class="bl-label">Mentionnée dans</span>' +
      mentioning.map(function(n){
        return '<span class="bl-tag" data-id="'+escapeHtml(n.id)+'">'+escapeHtml(n.title)+'</span>';
      }).join("");
  }

  /* ============ SIDEBAR ============ */

  function fmtDate(ts){
    var d = new Date(ts), now = Date.now(), diff = now - ts;
    if(diff < 60000) return "à l'instant";
    if(diff < 3600000) return Math.floor(diff/60000) + " min";
    if(diff < 86400000){
      return d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0");
    }
    if(diff < 604800000) return Math.floor(diff/86400000) + " j";
    return d.toLocaleDateString("fr-FR", { day:"numeric", month:"short" });
  }

  function noteItemHtml(n){
    var snippet = (n.subtitle||"").trim() || stripHtml(n.doc).slice(0,80) || noteText(n).slice(0,80) || "Vide";
    var badge = n.mode === "board" ? '<span class="mode-badge">tableau</span>'
              : n.mode === "map" ? '<span class="mode-badge">carte</span>' : "";
    return '<div class="note-item'+(n.id===currentId?" active":"")+'" draggable="true" data-id="'+escapeHtml(n.id)+'">'+
      '<div class="note-title">'+escapeHtml(n.title||"Sans titre")+badge+'</div>'+
      '<div class="note-snippet">'+escapeHtml(snippet)+'</div>'+
      '<div class="note-date">'+fmtDate(n.updated)+'</div>'+
      '<div class="note-actions">'+
        '<button class="mini" data-move="'+escapeHtml(n.id)+'" title="Déplacer">'+
          '<svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg></button>'+
        '<button class="mini" data-del="'+escapeHtml(n.id)+'" title="Supprimer">'+
          '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>'+
      '</div></div>';
  }

  function renderList(){
    var q = el.search.value.trim().toLowerCase();
    var sorted = notes.slice().sort(function(a,b){ return b.updated - a.updated; });

    if(q){
      var hits = sorted.filter(function(n){
        return (n.title||"").toLowerCase().indexOf(q) !== -1
          || (n.subtitle||"").toLowerCase().indexOf(q) !== -1
          || noteText(n).toLowerCase().indexOf(q) !== -1;
      });
      el.notesList.innerHTML = hits.length ? hits.map(noteItemHtml).join("")
        : '<div class="empty-hint">Aucune note ne correspond.</div>';
      return;
    }

    var html = "";
    folders.forEach(function(f){
      var inside = sorted.filter(function(n){ return n.folderId === f.id; });
      html += '<div class="folder">'+
        '<div class="folder-head" data-fhead="'+escapeHtml(f.id)+'">'+
          '<span class="fcaret'+(f.collapsed?"":" open")+'"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>'+
          '<span class="fname">'+escapeHtml(f.name)+'</span>'+
          '<span class="fcount">'+inside.length+'</span>'+
          '<span class="f-actions">'+
            '<button class="mini" data-fadd="'+escapeHtml(f.id)+'" title="Nouvelle note ici">'+
              '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>'+
            '<button class="mini" data-frename="'+escapeHtml(f.id)+'" title="Renommer">'+
              '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>'+
            '<button class="mini" data-fdel="'+escapeHtml(f.id)+'" title="Supprimer le dossier">'+
              '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>'+
          '</span></div>';
      if(!f.collapsed){
        html += '<div class="folder-body">'+
          (inside.length ? inside.map(noteItemHtml).join("") : '<div class="empty-hint small">Dossier vide</div>')+
        '</div>';
      }
      html += '</div>';
    });

    var loose = sorted.filter(function(n){
      if(!n.folderId) return true;
      for(var i=0;i<folders.length;i++) if(folders[i].id === n.folderId) return false;
      return true;
    });
    html += loose.map(noteItemHtml).join("");

    if(!folders.length && !loose.length) html = '<div class="empty-hint">Aucune note pour l\'instant.</div>';
    el.notesList.innerHTML = html;
  }

  /* ---- dossiers ---- */
  function createFolder(){
    var name = prompt("Nom du dossier");
    if(!name || !name.trim()) return;
    folders.push({ id:uid(), name:name.trim(), collapsed:false });
    persistFolders(); renderList();
  }
  function renameFolder(id){
    var f = folders.filter(function(x){ return x.id===id; })[0];
    if(!f) return;
    var name = prompt("Renommer le dossier", f.name);
    if(!name || !name.trim()) return;
    f.name = name.trim(); persistFolders(); renderList();
  }
  function deleteFolder(id){
    var f = folders.filter(function(x){ return x.id===id; })[0];
    if(!f) return;
    var count = notes.filter(function(n){ return n.folderId===id; }).length;
    var msg = count
      ? 'Supprimer le dossier "'+f.name+'" ? Ses '+count+' note(s) seront déplacées hors dossier, pas supprimées.'
      : 'Supprimer le dossier "'+f.name+'" ?';
    if(!confirm(msg)) return;
    notes.forEach(function(n){ if(n.folderId===id) n.folderId = null; });
    folders = folders.filter(function(x){ return x.id!==id; });
    persist(); persistFolders(); renderList();
    cloudDelete("folders", id);
  }
  function moveNote(noteId, folderId){
    var n = notes.filter(function(x){ return x.id===noteId; })[0];
    if(!n) return;
    n.folderId = folderId || null;
    touch(n); renderList();
  }
  function openMoveMenu(noteId, anchor){
    closeMoveMenu();
    var menu = document.createElement("div");
    menu.className = "move-menu"; menu.id = "moveMenu";
    var rows = ['<div class="mm-row" data-target="">Hors dossier</div>'];
    folders.forEach(function(f){
      rows.push('<div class="mm-row" data-target="'+escapeHtml(f.id)+'">'+escapeHtml(f.name)+'</div>');
    });
    rows.push('<div class="mm-row new" data-target="__new__">Nouveau dossier</div>');
    menu.innerHTML = rows.join("");
    document.body.appendChild(menu);

    var r = anchor.getBoundingClientRect(), box = menu.getBoundingClientRect();
    var left = Math.min(r.left, window.innerWidth - box.width - 10);
    var top = r.bottom + 6;
    if(top + box.height > window.innerHeight - 10) top = r.top - box.height - 6;
    menu.style.left = Math.max(10,left) + "px";
    menu.style.top = Math.max(10,top) + "px";

    menu.addEventListener("click", function(e){
      var row = e.target.closest("[data-target]");
      if(!row) return;
      var target = row.getAttribute("data-target");
      if(target === "__new__"){
        var name = prompt("Nom du dossier");
        if(name && name.trim()){
          var f = { id:uid(), name:name.trim(), collapsed:false };
          folders.push(f); persistFolders(); moveNote(noteId, f.id);
        }
      } else moveNote(noteId, target);
      closeMoveMenu();
    });
    setTimeout(function(){ document.addEventListener("mousedown", moveMenuOutside); }, 0);
  }
  function moveMenuOutside(e){ if(!e.target.closest("#moveMenu")) closeMoveMenu(); }
  function closeMoveMenu(){
    var m = document.getElementById("moveMenu");
    if(m) m.remove();
    document.removeEventListener("mousedown", moveMenuOutside);
  }

  /* ============ NAVIGATION ============ */

  function newNote(folderId){
    var note = {
      id:uid(), title:"", subtitle:"", doc:"", blocks:[], map:{children:[]},
      mode:"doc", folderId: typeof folderId === "string" ? folderId : null,
      created:Date.now(), updated:Date.now()
    };
    notes.push(note);
    if(note.folderId){
      var f = folders.filter(function(x){ return x.id===note.folderId; })[0];
      if(f){ f.collapsed = false; persistFolders(); }
    }
    persist();
    openNote(note.id);
    el.title.focus();
  }

  function openNote(id){
    var note = notes.filter(function(n){ return n.id===id; })[0];
    if(!note) return;
    closeAutocomplete();
    if(orderingMode) exitOrdering();
    currentId = id;
    selectedNodeId = null;

    el.title.value = note.title || "";
    el.subtitle.value = note.subtitle || "";
    el.area.style.display = "flex";
    el.welcome.style.display = "none";

    autoGrow();
    applyMode();
    renderList();
    renderBacklinks();
    if(window.innerWidth <= 820) document.body.classList.add("collapsed");
  }

  function deleteNote(id){
    var note = notes.filter(function(n){ return n.id===id; })[0];
    if(!note) return;
    var label = (note.title||"").trim() || "cette note";
    if(!confirm("Supprimer "+label+" ? Cette action est définitive.")) return;
    notes = notes.filter(function(n){ return n.id!==id; });
    persist();
    cloudDelete("notes", id);
    if(currentId === id){
      currentId = null;
      if(notes.length) openNote(notes.slice().sort(function(a,b){ return b.updated-a.updated; })[0].id);
      else { el.area.style.display = "none"; el.welcome.style.display = "flex"; renderList(); }
    } else { renderList(); renderBacklinks(); }
  }

  function autoGrow(){
    el.subtitle.style.height = "auto";
    el.subtitle.style.height = el.subtitle.scrollHeight + "px";
  }

  /* ============ MODES ============ */

  function setMode(mode){
    var note = current();
    if(!note) return;
    if(orderingMode) exitOrdering();
    if(note.mode === "board" && mode !== "board") collapseBoard(note);
    note.mode = mode;
    touch(note);
    applyMode();
  }

  function applyMode(){
    var note = current();
    if(!note) return;
    if(!note.map || !Array.isArray(note.map.children)) note.map = { children: [] };

    var isDoc = note.mode === "doc", isBoard = note.mode === "board", isMap = note.mode === "map";
    el.docPane.style.display = isDoc ? "flex" : "none";
    el.boardPane.style.display = isBoard ? "block" : "none";
    el.mapPane.style.display = isMap ? "flex" : "none";
    el.boardBtn.classList.toggle("on", isBoard);
    el.mapBtn.classList.toggle("on", isMap);
    el.outlineBtn.style.display = isMap ? "flex" : "none";

    Array.prototype.forEach.call(document.querySelectorAll(".doc-only"), function(b){
      b.style.display = isDoc ? "flex" : "none";
    });

    if(isDoc){
      el.editor.innerHTML = note.doc || "";
      renderLinksIn(el.editor);
      refreshPlaceholder(el.editor);
      activeEditor = el.editor;
    } else if(isBoard){
      buildBoard(note);
    } else {
      closeAutocomplete();
      if(!note.map.children.length){ note.map.children.push(makeNode("")); persist(); }
      renderMap();
    }
  }

  /* ============ MODE TEXTE ============ */

  function persistDoc(){
    var note = current();
    if(!note || note.mode !== "doc") return;
    note.doc = plainHtml(el.editor);
    touch(note);
    renderList();
  }

  function refreshPlaceholder(ed){
    var empty = !ed.textContent.trim() && !ed.querySelector("img,li");
    ed.classList.toggle("is-empty", empty);
  }

  function attachEditorEvents(ed, onInput){
    refreshPlaceholder(ed);
    ed.addEventListener("input", function(){
      refreshPlaceholder(ed);
      tagEmptyListItems(ed); onInput(); detectAutocomplete(ed);
    });
    ed.addEventListener("focus", function(){ activeEditor = ed; });
    ed.addEventListener("paste", function(e){
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData("text/plain");
      document.execCommand("insertText", false, text);
    });
    ed.addEventListener("click", function(e){
      var a = e.target.closest("a.note-link");
      if(a){
        var id = a.getAttribute("data-goto");
        if(id){ e.preventDefault(); openNote(id); return; }
      }
      var li = e.target.closest("li");
      if(li && li.parentElement && li.parentElement.classList.contains("checklist")){
        var rect = li.getBoundingClientRect();
        if(e.clientX - rect.left <= 28){
          e.preventDefault();
          li.classList.toggle("done");
          onInput();
        }
      }
    });
    ed.addEventListener("keydown", function(e){
      if(handleAutocompleteKey(e, ed)) return;
      if(e.key === "Enter" && e.shiftKey){
        var li = currentListItem(ed);
        if(li){
          e.preventDefault();
          var spacer = document.createElement("li");
          spacer.className = "spacer"; spacer.innerHTML = "<br>";
          var next = document.createElement("li"); next.innerHTML = "<br>";
          li.after(spacer); spacer.after(next);
          var range = document.createRange();
          range.setStart(next, 0); range.collapse(true);
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
          onInput();
        }
      }
      var meta = e.metaKey || e.ctrlKey;
      if(meta && e.key.toLowerCase()==="b"){ e.preventDefault(); document.execCommand("bold"); onInput(); }
      if(meta && e.key.toLowerCase()==="i"){ e.preventDefault(); document.execCommand("italic"); onInput(); }
    });
    // les liens ne sont rendus qu'a la sortie : y toucher pendant la frappe
    // ferait sauter le curseur
    ed.addEventListener("blur", function(){
      setTimeout(function(){
        if(ac) return;
        renderLinksIn(ed);
        renderBacklinks();
      }, 0);
    });
  }

  function currentListItem(scope){
    var node = window.getSelection().anchorNode;
    while(node && node !== scope){
      if(node.nodeType===1 && node.tagName==="LI") return node;
      node = node.parentNode;
    }
    return null;
  }
  function tagEmptyListItems(ed){
    Array.prototype.forEach.call(ed.querySelectorAll("li"), function(li){
      var empty = !li.textContent.trim() && !li.querySelector("img");
      li.classList.toggle("empty", empty && !li.classList.contains("done"));
    });
  }
  function currentBlockTag(){
    var node = window.getSelection().anchorNode;
    while(node && node !== activeEditor){
      if(node.nodeType===1 && /^(H1|H2|BLOCKQUOTE)$/.test(node.tagName)) return node.tagName.toLowerCase();
      node = node.parentNode;
    }
    return "";
  }
  function currentListParent(){
    var node = window.getSelection().anchorNode;
    while(node && node !== activeEditor){
      if(node.nodeType===1 && (node.tagName==="UL"||node.tagName==="OL")) return node;
      node = node.parentNode;
    }
    return null;
  }
  function toggleChecklist(){
    var ul = currentListParent();
    if(ul && ul.tagName==="UL" && ul.classList.contains("checklist")){
      ul.classList.remove("checklist");
      Array.prototype.forEach.call(ul.querySelectorAll("li"), function(li){ li.classList.remove("done"); });
      document.execCommand("insertUnorderedList");
    } else {
      document.execCommand("insertUnorderedList");
      var nul = currentListParent();
      if(nul && nul.tagName==="UL") nul.classList.add("checklist");
    }
  }

  var writeWine = false;
  function toggleColorSwitch(){
    if(!activeEditor) return;
    writeWine = !writeWine;
    el.colorBtn.querySelector(".cs-dot.ink").classList.toggle("active", !writeWine);
    el.colorBtn.querySelector(".cs-dot.wine").classList.toggle("active", writeWine);
    try { document.execCommand("styleWithCSS", false, true); } catch(e){}
    var color = writeWine ? getComputedStyle(document.documentElement).getPropertyValue("--wine").trim()
                          : getComputedStyle(activeEditor).color;
    document.execCommand("foreColor", false, color);
  }

  var hlColor = "#FFE27A", savedRange = null;
  function saveRange(){
    var sel = window.getSelection();
    if(sel.rangeCount) savedRange = sel.getRangeAt(0).cloneRange();
  }
  function applyHighlight(color){
    if(!activeEditor) return;
    activeEditor.focus();
    if(savedRange){ var s = window.getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
    try { document.execCommand("styleWithCSS", false, true); } catch(e){}
    if(color === "clear"){
      document.execCommand("hiliteColor", false, "transparent");
    } else {
      hlColor = color;
      el.hlSwatch.style.background = color;
      document.execCommand("hiliteColor", false, color);
    }
    fireInput();
  }
  function fireInput(){
    if(activeEditor) activeEditor.dispatchEvent(new Event("input", { bubbles:true }));
  }

  /* ============ MODE TABLEAU ============ */

  function buildBoard(note){
    el.boardPane.innerHTML = "";
    var canvas = document.createElement("div");
    canvas.className = "canvas";
    el.boardPane.appendChild(canvas);

    if(!note.blocks.length){
      var hint = document.createElement("div");
      hint.className = "canvas-hint";
      hint.textContent = "Clique n'importe où pour écrire ici, puis clique ailleurs pour écrire à côté";
      canvas.appendChild(hint);
    }
    note.blocks.forEach(function(b){ canvas.appendChild(makeBlock(note, b)); });

    canvas.addEventListener("mousedown", function(e){
      if(e.target !== canvas) return;
      var rect = canvas.getBoundingClientRect(), pad = 8;
      var blocks = canvas.querySelectorAll(".block");
      for(var i=0;i<blocks.length;i++){
        var r = blocks[i].getBoundingClientRect();
        if(e.clientX >= r.left-pad && e.clientX <= r.right+pad &&
           e.clientY >= r.top-pad && e.clientY <= r.bottom+pad){
          e.preventDefault();
          blocks[i].querySelector(".editor").focus();
          return;
        }
      }
      var b = {
        id:uid(),
        x: Math.max(0, Math.round(e.clientX - rect.left - 16)),
        y: Math.max(0, Math.round(e.clientY - rect.top - 14)),
        w: 260, html: ""
      };
      note.blocks.push(b);
      var h = canvas.querySelector(".canvas-hint");
      if(h) h.remove();
      var node = makeBlock(note, b);
      canvas.appendChild(node);
      var ed = node.querySelector(".editor");
      setTimeout(function(){ ed.focus(); }, 0);
      touch(note);
    });
    return canvas;
  }

  function makeBlock(note, b){
    var block = document.createElement("div");
    block.className = "block";
    block.style.left = b.x + "px";
    block.style.top = b.y + "px";
    block.style.width = b.w + "px";
    block.setAttribute("data-id", b.id);

    var grip = document.createElement("div");
    grip.className = "block-grip";
    grip.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="7" r="1.6"/><circle cx="12" cy="7" r="1.6"/><circle cx="17" cy="7" r="1.6"/><circle cx="7" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="17" cy="12" r="1.6"/></svg>';

    var del = document.createElement("button");
    del.className = "block-del";
    del.title = "Supprimer ce texte";
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    del.addEventListener("mousedown", function(e){ e.stopPropagation(); e.preventDefault(); });
    del.addEventListener("click", function(e){
      e.stopPropagation();
      note.blocks = note.blocks.filter(function(x){ return x.id!==b.id; });
      block.remove();
      touch(note);
    });

    var ed = document.createElement("div");
    ed.className = "editor";
    ed.contentEditable = "true";
    ed.spellcheck = true;
    ed.setAttribute("data-ph", "Écris ici");
    ed.innerHTML = b.html || "";
    renderLinksIn(ed);
    attachEditorEvents(ed, function(){
      b.html = plainHtml(ed);
      touch(note);
    });
    ed.addEventListener("blur", function(){
      if(!htmlToText(b.html).trim() && !block.classList.contains("dragging")){
        note.blocks = note.blocks.filter(function(x){ return x.id!==b.id; });
        block.remove();
        touch(note);
      }
    });

    var resize = document.createElement("div");
    resize.className = "block-resize";

    block.appendChild(grip); block.appendChild(del);
    block.appendChild(ed); block.appendChild(resize);
    dragByHandle(grip, block, b, note);
    resizeByHandle(resize, block, b, note);
    return block;
  }

  function dragByHandle(handle, block, b, note){
    handle.addEventListener("pointerdown", function(e){
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      block.classList.add("dragging");
      var sx = e.clientX, sy = e.clientY, ox = b.x, oy = b.y;
      function move(ev){
        b.x = Math.max(0, ox + (ev.clientX - sx));
        b.y = Math.max(0, oy + (ev.clientY - sy));
        block.style.left = b.x + "px";
        block.style.top = b.y + "px";
      }
      function up(){
        block.classList.remove("dragging");
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        touch(note);
      }
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
    });
  }
  function resizeByHandle(handle, block, b, note){
    handle.addEventListener("pointerdown", function(e){
      e.preventDefault(); e.stopPropagation();
      handle.setPointerCapture(e.pointerId);
      var sx = e.clientX, ow = b.w;
      function move(ev){
        b.w = Math.max(140, ow + (ev.clientX - sx));
        block.style.width = b.w + "px";
      }
      function up(){
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        touch(note);
      }
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
    });
  }

  /* ---- fusion du tableau vers le texte, avec choix de l'ordre ---- */
  var orderingMode = false, orderSeq = [];

  function textBlocks(note){
    return note.blocks.filter(function(b){ return htmlToText(b.html).trim(); });
  }
  function computedOrder(note){
    var ids = textBlocks(note).map(function(b){ return b.id; });
    var order = orderSeq.filter(function(id){ return ids.indexOf(id) !== -1; });
    textBlocks(note).slice().sort(function(a,b){ return a.y-b.y || a.x-b.x; })
      .forEach(function(b){ if(order.indexOf(b.id) === -1) order.push(b.id); });
    return order;
  }
  function collapseBoard(note){
    // appelee quand on quitte le tableau : on recompose le texte
    var order = computedOrder(note);
    var byId = {};
    note.blocks.forEach(function(b){ byId[b.id] = b; });
    var merged = order.map(function(id){ return byId[id]; }).filter(Boolean)
      .map(function(b){ return b.html; }).filter(function(h){ return htmlToText(h).trim(); })
      .join("<p><br></p>");
    if(merged) note.doc = merged;
  }
  function startMerge(note){
    if(textBlocks(note).length <= 1){ setMode("doc"); return; }
    orderingMode = true; orderSeq = [];
    el.boardPane.classList.add("ordering");
    var usable = {};
    textBlocks(note).forEach(function(b){ usable[b.id] = 1; });
    Array.prototype.forEach.call(el.boardPane.querySelectorAll(".block"), function(bl){
      if(!usable[bl.getAttribute("data-id")]) return;
      var bub = document.createElement("div"); bub.className = "order-bubble";
      var cover = document.createElement("div"); cover.className = "order-cover";
      cover.addEventListener("click", function(e){
        e.stopPropagation();
        var id = bl.getAttribute("data-id");
        var i = orderSeq.indexOf(id);
        if(i >= 0) orderSeq.splice(i,1); else orderSeq.push(id);
        refreshBubbles(note);
      });
      bl.appendChild(bub); bl.appendChild(cover);
    });
    showMergeBar(note);
    refreshBubbles(note);
  }
  function refreshBubbles(note){
    var order = computedOrder(note);
    Array.prototype.forEach.call(el.boardPane.querySelectorAll(".block"), function(bl){
      var bub = bl.querySelector(".order-bubble");
      if(!bub) return;
      var id = bl.getAttribute("data-id");
      var pos = order.indexOf(id);
      bub.textContent = pos >= 0 ? String(pos+1) : "";
      bub.classList.toggle("on", orderSeq.indexOf(id) !== -1);
    });
  }
  function showMergeBar(note){
    removeMergeBar();
    var bar = document.createElement("div");
    bar.className = "merge-bar"; bar.id = "mergeBar";
    bar.innerHTML = '<span>Ordre proposé de haut en bas. Clique un texte pour l\'ajuster.</span>'+
      '<button class="mb-btn mb-cancel" id="mbCancel">Annuler</button>'+
      '<button class="mb-btn mb-go" id="mbGo">Fusionner</button>';
    document.body.appendChild(bar);
    document.getElementById("mbCancel").addEventListener("click", function(){ orderSeq = []; exitOrdering(); });
    document.getElementById("mbGo").addEventListener("click", function(){
      exitOrdering();
      setMode("doc");
    });
  }
  function removeMergeBar(){
    var b = document.getElementById("mergeBar");
    if(b) b.remove();
  }
  function exitOrdering(){
    orderingMode = false;
    el.boardPane.classList.remove("ordering");
    Array.prototype.forEach.call(el.boardPane.querySelectorAll(".order-cover,.order-bubble"), function(e){ e.remove(); });
    removeMergeBar();
  }

  /* ============ MODE CARTE ============ */

  var BRANCH_COLORS = [
    { id:"indigo",  light:"#4F46E5", dark:"#8B85FF", name:"Indigo" },
    { id:"vin",     light:"#B0405C", dark:"#E0788F", name:"Vin" },
    { id:"ambre",   light:"#B77415", dark:"#E0A44E", name:"Ambre" },
    { id:"vert",    light:"#2F8F5B", dark:"#5FC98E", name:"Vert" },
    { id:"bleu",    light:"#2D6FB5", dark:"#69A8E8", name:"Bleu" },
    { id:"violet",  light:"#7B4FC7", dark:"#B392F0", name:"Violet" },
    { id:"ardoise", light:"#5A6472", dark:"#9AA5B5", name:"Ardoise" }
  ];
  function colorValue(id){
    var c = BRANCH_COLORS[0];
    for(var i=0;i<BRANCH_COLORS.length;i++) if(BRANCH_COLORS[i].id===id){ c = BRANCH_COLORS[i]; break; }
    return document.documentElement.getAttribute("data-theme")==="dark" ? c.dark : c.light;
  }
  function makeNode(text){ return { id:uid(), text:text||"", collapsed:false, children:[] }; }

  function findNode(id, list, parent){
    var note = current();
    list = list || (note ? note.map.children : []);
    for(var i=0;i<list.length;i++){
      if(list[i].id === id) return { node:list[i], parent:parent||null, siblings:list, index:i };
      var deep = findNode(id, list[i].children, list[i]);
      if(deep) return deep;
    }
    return null;
  }
  function branchOf(id){
    var note = current();
    if(!note || !id || id === "__root__") return null;
    var top = null;
    (function walk(list, root){
      list.forEach(function(n){
        var head = root || n;
        if(n.id === id) top = head;
        walk(n.children, head);
      });
    })(note.map.children, null);
    return top;
  }

  var measureCtx;
  function measureText(text, bold){
    if(measureCtx === undefined){
      try { measureCtx = document.createElement("canvas").getContext("2d") || null; }
      catch(e){ measureCtx = null; }
    }
    if(!measureCtx) return (text||"").length * (bold ? 8.4 : 7.6);
    try {
      measureCtx.font = (bold ? "700 " : "500 ") + '14px "Space Grotesk", sans-serif';
      return measureCtx.measureText(text||"").width;
    } catch(e){ return (text||"").length * (bold ? 8.4 : 7.6); }
  }
  var MAP = { nodeH:36, vGap:12, hGap:56, padX:40, padY:40, minW:90, maxW:260, textPad:30 };
  function nodeWidth(text, isRoot){
    var w = measureText(text || "Nouvelle idée", isRoot) + MAP.textPad + (isRoot ? 10 : 0);
    return Math.max(MAP.minW, Math.min(MAP.maxW, w));
  }

  function layoutMap(note){
    var root = { id:"__root__", text: note.title || "Sans titre",
      children: note.map.children, collapsed:false, isRoot:true };

    var widths = [];
    (function scan(node, depth){
      var w = nodeWidth(node.text, node.isRoot);
      if(!widths[depth] || w > widths[depth]) widths[depth] = w;
      if(node.collapsed) return;
      node.children.forEach(function(c){ scan(c, depth+1); });
    })(root, 0);

    var colX = [], acc = MAP.padX;
    for(var d=0; d<widths.length; d++){ colX[d] = acc; acc += widths[d] + MAP.hGap; }

    note.map.children.forEach(function(branch, i){
      if(!branch.color) branch.color = BRANCH_COLORS[i % BRANCH_COLORS.length].id;
    });

    var placed = [], cursorY = MAP.padY;
    (function place(node, depth, colorId){
      var entry = {
        id:node.id, node:node, depth:depth, isRoot:!!node.isRoot,
        x:colX[depth], w:nodeWidth(node.text, node.isRoot), colorId:colorId
      };
      if(node.collapsed || !node.children.length){
        entry.y = cursorY;
        cursorY += MAP.nodeH + MAP.vGap;
      } else {
        var firstY = null, lastY = null;
        node.children.forEach(function(child){
          var col = depth === 0 ? child.color : colorId;
          var ce = place(child, depth+1, col);
          if(firstY === null) firstY = ce.y;
          lastY = ce.y;
        });
        entry.y = (firstY + lastY) / 2;
      }
      placed.push(entry);
      return entry;
    })(root, 0, null);

    var maxX = 0, maxY = 0;
    placed.forEach(function(p){
      if(p.x + p.w > maxX) maxX = p.x + p.w;
      if(p.y + MAP.nodeH > maxY) maxY = p.y + MAP.nodeH;
    });
    return { nodes:placed, width:maxX + MAP.padX, height:Math.max(maxY + MAP.padY, 300) };
  }

  var selectedNodeId = null;

  function renderMap(){
    var note = current();
    if(!note) return;
    var layout = layoutMap(note), byId = {};
    layout.nodes.forEach(function(p){ byId[p.id] = p; });

    var svg = [];
    layout.nodes.forEach(function(p){
      if(p.node.collapsed) return;
      p.node.children.forEach(function(child){
        var c = byId[child.id];
        if(!c) return;
        var x1 = p.x + p.w, y1 = p.y + MAP.nodeH/2;
        var x2 = c.x, y2 = c.y + MAP.nodeH/2, mid = (x1+x2)/2;
        svg.push('<path d="M'+x1+' '+y1+' C'+mid+' '+y1+', '+mid+' '+y2+', '+x2+' '+y2+
          '" fill="none" stroke="'+colorValue(c.colorId)+'" stroke-width="2" stroke-linecap="round" opacity="0.55"/>');
      });
    });

    var html = layout.nodes.map(function(p){
      var cls = "mnode" + (p.isRoot ? " root" : "") + (p.id === selectedNodeId ? " sel" : "");
      var accent = p.isRoot ? "var(--accent)" : colorValue(p.colorId);
      var style = "left:"+p.x+"px;top:"+p.y+"px;min-width:"+p.w+"px;height:"+MAP.nodeH+"px;--nc:"+accent+";";
      var toggle = p.node.children.length
        ? '<button class="mtoggle" data-toggle="'+escapeHtml(p.id)+'" title="Replier ou déplier">'+
            (p.node.collapsed ? p.node.children.length : "&minus;")+'</button>'
        : "";
      var add = '<button class="madd" data-add="'+escapeHtml(p.id)+'" title="Ajouter une sous-idée">+</button>';
      return '<div class="'+cls+'" data-node="'+escapeHtml(p.id)+'" draggable="'+(p.isRoot?"false":"true")+'" style="'+style+'">'+
        '<span class="mtext" contenteditable="true" spellcheck="false" data-edit="'+escapeHtml(p.id)+'">'+
          escapeHtml(p.node.text)+'</span>'+toggle+add+'</div>';
    }).join("");

    el.mapCanvas.style.width = layout.width + "px";
    el.mapCanvas.style.height = layout.height + "px";
    el.mapCanvas.innerHTML = '<svg class="mlines" width="'+layout.width+'" height="'+layout.height+'">'+
      svg.join("")+'</svg>'+html;
    renderBranchBar();
    renderOutline();
  }

  function renderBranchBar(){
    var branch = branchOf(selectedNodeId);
    if(!branch){ el.branchBar.className = "branch-bar"; el.branchBar.innerHTML = ""; return; }
    var isSelf = branch.id === selectedNodeId;
    el.branchBar.className = "branch-bar on";
    el.branchBar.innerHTML = '<span class="bb-label">'+
      (isSelf ? "Couleur de la branche" : "Couleur de "+escapeHtml(branch.text || "la branche"))+'</span>'+
      BRANCH_COLORS.map(function(c){
        return '<button class="bb-dot'+(branch.color===c.id?" on":"")+'" data-color="'+c.id+
          '" title="'+c.name+'" style="background:'+colorValue(c.id)+'"></button>';
      }).join("");
  }

  /* ---- panneau plan : la meme arborescence, en texte ---- */

  var outlineOn = false;

  function renderOutline(){
    if(!outlineOn) return;
    var note = current();
    if(!note){ el.outline.innerHTML = ""; return; }

    var rows = [];
    (function walk(list, depth, colorId){
      list.forEach(function(n){
        var col = depth === 0 ? n.color : colorId;
        var kids = n.children.length;
        var caret = kids
          ? '<span class="ol-caret'+(n.collapsed?"":" open")+'" data-olt="'+escapeHtml(n.id)+'">'+
              '<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>'
          : '<span class="ol-caret leaf"></span>';
        rows.push(
          '<div class="ol-row d'+depth+(n.id===selectedNodeId?" sel":"")+'" draggable="true" '+
            'data-ol="'+escapeHtml(n.id)+'" style="--d:'+depth+';--oc:'+colorValue(col)+'">'+
            '<span class="ol-rail"></span>'+caret+
            '<span class="ol-text'+(n.text.trim()?"":" vide")+'">'+
              escapeHtml(n.text.trim() || "Idée")+'</span>'+
            (kids ? '<span class="ol-count">'+kids+'</span>' : "")+
            '<button class="ol-add" data-oladd="'+escapeHtml(n.id)+'" title="Ajouter une sous-idée">+</button>'+
          '</div>');
        if(!n.collapsed) walk(n.children, depth+1, col);
      });
    })(note.map.children, 0, null);

    el.outline.innerHTML = '<div class="ol-head">Plan</div>' +
      (rows.length ? rows.join("") :
        '<div class="ol-empty">Aucune idée pour l\'instant. Utilise le bouton + sur un nœud.</div>');
  }

  function setOutline(on){
    outlineOn = !!on;
    el.outline.className = "outline" + (outlineOn ? " on" : "");
    el.mapPane.classList.toggle("with-outline", outlineOn);
    el.outlineBtn.classList.toggle("on", outlineOn);
    el.outlineBtn.setAttribute("title", outlineOn ? "Masquer le plan" : "Afficher le plan");
    try { localStorage.setItem("notes.app.outline", outlineOn ? "1" : "0"); } catch(e){}
    if(outlineOn) renderOutline();
  }

  /* ---- deplacer un noeud dans l arborescence ---- */

  // interdit de deposer un noeud dans sa propre descendance
  function isDescendant(ancestorId, id){
    var found = findNode(ancestorId);
    if(!found) return false;
    var hit = false;
    (function walk(list){
      list.forEach(function(n){
        if(n.id === id) hit = true;
        walk(n.children);
      });
    })(found.node.children);
    return hit;
  }

  // position : "before", "after" ou "into"
  function moveNodeTo(dragId, targetId, position){
    if(!dragId || !targetId || dragId === targetId) return false;
    if(isDescendant(dragId, targetId)) return false;

    var src = findNode(dragId);
    if(!src) return false;
    src.siblings.splice(src.index, 1);

    var node = src.node;
    var dst = findNode(targetId);
    if(!dst){
      // la cible a disparu, on remet le noeud a sa place
      src.siblings.splice(src.index, 0, node);
      return false;
    }

    if(position === "into"){
      dst.node.collapsed = false;
      dst.node.children.push(node);
    } else {
      var at = position === "before" ? dst.index : dst.index + 1;
      dst.siblings.splice(at, 0, node);
    }

    // une branche de premier niveau doit porter une couleur, une sous-idee non
    var now = findNode(node.id);
    if(now && !now.parent){
      if(!node.color) node.color = BRANCH_COLORS[(current().map.children.length-1) % BRANCH_COLORS.length].id;
    } else {
      delete node.color;
    }

    saveMap(); renderMap(); renderOutline();
    return true;
  }

  function saveMap(){
    var note = current();
    if(!note) return;
    touch(note);
    renderList();
  }
  function addSibling(id){
    var note = current(); if(!note) return;
    var found = findNode(id), node = makeNode("");
    if(!found) note.map.children.push(node);
    else found.siblings.splice(found.index+1, 0, node);
    saveMap(); renderMap(); focusNode(node.id);
  }
  function addChild(id){
    var note = current(); if(!note) return;
    var node = makeNode("");
    if(id === "__root__") note.map.children.push(node);
    else {
      var found = findNode(id);
      if(!found) return;
      found.node.collapsed = false;
      found.node.children.push(node);
    }
    saveMap(); renderMap(); focusNode(node.id);
  }
  function outdentNode(id){
    var found = findNode(id);
    if(!found || !found.parent) return;
    var grand = findNode(found.parent.id);
    var target = grand ? grand.siblings : current().map.children;
    var at = grand ? grand.index+1 : target.length;
    found.siblings.splice(found.index, 1);
    target.splice(at, 0, found.node);
    saveMap(); renderMap(); focusNode(id);
  }
  function removeNode(id){
    var found = findNode(id);
    if(!found) return;
    var kids = found.node.children;
    found.siblings.splice(found.index, 1);
    if(kids.length) found.siblings.splice.apply(found.siblings, [found.index, 0].concat(kids));
    saveMap(); renderMap();
  }
  function focusNode(id){
    setTimeout(function(){
      var span = el.mapCanvas.querySelector('[data-edit="'+id+'"]');
      if(!span) return;
      selectedNodeId = id;
      span.focus();
      var range = document.createRange();
      range.selectNodeContents(span); range.collapse(false);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      renderBranchBar();
      var wrap = span.closest(".mnode");
      if(wrap && wrap.scrollIntoView) wrap.scrollIntoView({ block:"nearest", inline:"nearest" });
    }, 0);
  }

  /* ============ AUTOCOMPLETE DES LIENS ============ */

  var ac = null, acMatches = [], acIndex = 0, acCtx = null;

  function closeAutocomplete(){
    if(ac){ ac.remove(); ac = null; }
    acMatches = []; acCtx = null;
  }

  function detectAutocomplete(scope){
    closeAutocomplete();
    var sel = window.getSelection();
    if(!sel || !sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if(!range.collapsed) return;
    var node = range.endContainer;
    if(node.nodeType !== 3) return;
    if(scope && !scope.contains(node)) return;

    var before = node.textContent.slice(0, range.endOffset);
    var hash = before.lastIndexOf("#");
    if(hash === -1) return;
    var query = before.slice(hash+1);
    if(query.length > 40 || /[\n\r]/.test(query)) return;

    var q = query.trim().toLowerCase();
    var matches = notes.filter(function(n){
      if(n.id === currentId) return false;
      if(!(n.title||"").trim()) return false;
      return q === "" || n.title.toLowerCase().indexOf(q) !== -1;
    }).sort(function(a,b){ return b.updated - a.updated; }).slice(0,6);
    if(!matches.length) return;

    acCtx = { node:node, hash:hash, end:range.endOffset, scope:scope };
    acMatches = matches; acIndex = 0;
    showAutocomplete();
  }

  function showAutocomplete(){
    ac = document.createElement("div");
    ac.className = "ac";
    acMatches.forEach(function(m, i){
      var item = document.createElement("div");
      item.className = "ac-item" + (i === acIndex ? " sel" : "");
      item.textContent = m.title;
      // mousedown avec preventDefault : l'editeur ne perd pas le focus,
      // le noeud de texte reste vivant et l'insertion fonctionne
      item.addEventListener("mousedown", function(e){ e.preventDefault(); applyAutocomplete(m); });
      ac.appendChild(item);
    });
    document.body.appendChild(ac);
    positionAutocomplete();
  }
  function positionAutocomplete(){
    if(!ac) return;
    var sel = window.getSelection();
    if(!sel || !sel.rangeCount) return;
    var rect = sel.getRangeAt(0).getBoundingClientRect(), box = ac.getBoundingClientRect();
    var left = rect.left;
    if(left + box.width > window.innerWidth - 10) left = window.innerWidth - box.width - 10;
    if(left < 10) left = 10;
    var top = rect.bottom + 6;
    if(top + box.height > window.innerHeight - 10) top = rect.top - box.height - 6;
    if(top < 10) top = 10;
    ac.style.left = left + "px";
    ac.style.top = top + "px";
  }
  function refreshAcSelection(){
    if(!ac) return;
    var items = ac.querySelectorAll(".ac-item");
    for(var i=0;i<items.length;i++) items[i].className = "ac-item" + (i === acIndex ? " sel" : "");
  }
  function applyAutocomplete(match){
    if(!acCtx) return;
    var node = acCtx.node, text = node.textContent;
    var inserted = "#" + match.title + " ";
    var head = text.slice(0, acCtx.hash), tail = text.slice(acCtx.end);
    node.textContent = head + inserted + tail;

    var pos = head.length + inserted.length;
    var range = document.createRange();
    range.setStart(node, Math.min(pos, node.textContent.length));
    range.collapse(true);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);

    var scope = acCtx.scope;
    closeAutocomplete();
    if(scope) scope.dispatchEvent(new Event("input", { bubbles:true }));
  }
  function handleAutocompleteKey(e){
    if(!ac) return false;
    if(e.key === "ArrowDown"){ e.preventDefault(); acIndex = (acIndex+1) % acMatches.length; refreshAcSelection(); return true; }
    if(e.key === "ArrowUp"){ e.preventDefault(); acIndex = (acIndex-1+acMatches.length) % acMatches.length; refreshAcSelection(); return true; }
    if(e.key === "Enter" || e.key === "Tab"){ e.preventDefault(); applyAutocomplete(acMatches[acIndex]); return true; }
    if(e.key === "Escape"){ e.preventDefault(); closeAutocomplete(); return true; }
    return false;
  }

  /* ============ SYNCHRO CLOUD ============ */

  // Si la table en ligne ne possede pas encore les colonnes title, subtitle et
  // map, on range ces informations dans un commentaire invisible ajoute au
  // texte. Rien a migrer a la main, et si les colonnes sont ajoutees un jour,
  // le format complet reprend automatiquement.
  var legacyCloud = false;
  var META_OPEN = "<!--tos:", META_CLOSE = "-->";

  function encodeMeta(obj){
    try { return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
    catch(e){ return ""; }
  }
  function decodeMeta(str){
    try { return JSON.parse(decodeURIComponent(escape(atob(str)))); }
    catch(e){ return null; }
  }
  function packDoc(n){
    var meta = encodeMeta({ t:n.title||"", s:n.subtitle||"", m:n.map||{children:[]} });
    return (n.doc||"") + (meta ? META_OPEN + meta + META_CLOSE : "");
  }
  function unpackDoc(doc){
    doc = doc || "";
    var i = doc.lastIndexOf(META_OPEN);
    if(i === -1) return { doc:doc, meta:null };
    var j = doc.indexOf(META_CLOSE, i);
    if(j === -1) return { doc:doc, meta:null };
    return {
      doc: doc.slice(0, i) + doc.slice(j + META_CLOSE.length),
      meta: decodeMeta(doc.slice(i + META_OPEN.length, j))
    };
  }

  function noteToRow(n){
    var row = {
      id:n.id, blocks:n.blocks||[], mode:n.mode||"doc",
      folder_id:n.folderId||null,
      created_at:new Date(n.created||Date.now()).toISOString(),
      updated_at:new Date(n.updated||Date.now()).toISOString()
    };
    if(legacyCloud){
      row.doc = packDoc(n);
    } else {
      row.doc = n.doc||"";
      row.title = n.title||"";
      row.subtitle = n.subtitle||"";
      row.map = n.map||{children:[]};
    }
    return row;
  }

  function rowToNote(r){
    var unpacked = unpackDoc(r.doc);
    var meta = unpacked.meta;

    var map = r.map !== undefined && r.map !== null ? r.map : (meta ? meta.m : null);
    if(typeof map === "string"){ try { map = JSON.parse(map); } catch(e){ map = null; } }
    if(!map || !Array.isArray(map.children)) map = { children: [] };
    normalizeNodes(map.children);

    var n = {
      id:r.id, doc:unpacked.doc, blocks:Array.isArray(r.blocks)?r.blocks:[],
      mode:(r.mode==="board"||r.mode==="map")?r.mode:"doc",
      title:r.title || (meta ? meta.t : "") || "",
      subtitle:r.subtitle || (meta ? meta.s : "") || "",
      map:map, folderId:r.folder_id||null,
      created:Date.parse(r.created_at)||Date.now(),
      updated:Date.parse(r.updated_at)||Date.now()
    };
    if(!n.title){
      var first = noteText(n).split("\n")[0].slice(0,80).trim();
      n.title = first || "Sans titre";
    }
    return n;
  }
  function folderToRow(f){
    return { id:f.id, name:f.name||"", collapsed:!!f.collapsed, updated_at:new Date().toISOString() };
  }

  function setSyncState(state){
    el.syncDot.className = "sync-dot " + state;
    el.syncDot.title = state === "synced" ? "Synchronisé"
                     : state === "syncing" ? "Synchronisation en cours" : "Local uniquement";
  }
  function scheduleCloudPush(){
    if(!sb || !session || syncing) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushAll, 800);
  }
  // Une erreur de colonne inconnue signifie que la table n'a pas encore les
  // champs title, subtitle et map. On bascule alors en mode compact.
  function isMissingColumn(res){
    if(!res) return false;
    var err = res.error || res;
    var msg = ((err && (err.message || err.details || err.hint)) || "") + " " + ((err && err.code) || "");
    return /column|schema cache|PGRST204|42703/i.test(msg);
  }

  function pushNotes(){
    if(!notes.length) return Promise.resolve();
    return sb.from("notes").upsert(notes.map(noteToRow)).then(function(res){
      if(res && res.error){
        if(!legacyCloud && isMissingColumn(res)){
          legacyCloud = true;
          return sb.from("notes").upsert(notes.map(noteToRow));
        }
        throw res.error;
      }
      return res;
    }).catch(function(e){
      if(!legacyCloud && isMissingColumn(e)){
        legacyCloud = true;
        return sb.from("notes").upsert(notes.map(noteToRow));
      }
      throw e;
    });
  }

  function pushAll(){
    if(!sb || !session) return Promise.resolve();
    setSyncState("syncing");
    var jobs = [];
    if(folders.length) jobs.push(sb.from("folders").upsert(folders.map(folderToRow)));
    jobs.push(pushNotes());
    return Promise.all(jobs).then(function(){ setSyncState("synced"); })
      .catch(function(){ setSyncState("synced"); });
  }
  function cloudDelete(table, id){
    if(!sb || !session) return;
    try { sb.from(table).delete().eq("id", id); } catch(e){}
  }
  function pullAndMerge(){
    if(!sb || !session) return Promise.resolve();
    syncing = true;
    setSyncState("syncing");
    return Promise.all([ sb.from("folders").select("*"), sb.from("notes").select("*") ])
      .then(function(res){
        var cf = res[0] && res[0].data ? res[0].data : [];
        var cn = res[1] && res[1].data ? res[1].data : [];

        // si les lignes recues n'ont pas la colonne title, la table est
        // restee au format d'origine : on ecrira en mode compact
        if(cn.length && !cn.some(function(r){ return r.title !== undefined; })) legacyCloud = true;

        var fMap = {};
        folders.forEach(function(f){ fMap[f.id] = f; });
        cf.forEach(function(r){ fMap[r.id] = { id:r.id, name:r.name||"", collapsed:!!r.collapsed }; });
        folders = Object.keys(fMap).map(function(k){ return fMap[k]; });

        var nMap = {};
        notes.forEach(function(n){ nMap[n.id] = n; });
        cn.forEach(function(r){
          var remote = rowToNote(r), local = nMap[r.id];
          if(!local || remote.updated >= local.updated) nMap[r.id] = remote;
        });
        notes = Object.keys(nMap).map(function(k){ return nMap[k]; });

        saveLocalOnly();
        renderList();
        if(!current() && notes.length){
          openNote(notes.slice().sort(function(a,b){ return b.updated-a.updated; })[0].id);
        } else if(current()) openNote(currentId);
      })
      .catch(function(){})
      .then(function(){
        syncing = false;
        setSyncState("synced");
        return pushAll();
      });
  }

  function renderAccount(){
    if(session && session.user){
      el.account.innerHTML = '<span class="acc-dot on"></span><span class="acc-mail"></span>'+
        '<button class="acc-btn" id="logoutBtn">Déconnexion</button>';
      el.account.querySelector(".acc-mail").textContent = session.user.email || "Connecté";
      el.account.querySelector("#logoutBtn").addEventListener("click", doLogout);
    } else {
      el.account.innerHTML = '<span class="acc-dot off"></span><span class="acc-mail">Local uniquement</span>'+
        '<button class="acc-btn" id="loginBtn">Synchroniser</button>';
      el.account.querySelector("#loginBtn").addEventListener("click", function(){
        el.authOverlay.style.display = "flex";
      });
    }
  }
  function doLogout(){
    if(sb){ try { sb.auth.signOut(); } catch(e){} }
    session = null;
    renderAccount();
    setSyncState("local");
    el.authOverlay.style.display = "flex";
  }
  function sendMagicLink(){
    var email = (el.authEmail.value||"").trim();
    if(!email || email.indexOf("@") === -1){
      el.authMsg.className = "auth-msg err";
      el.authMsg.textContent = "Entre une adresse email valide.";
      return;
    }
    if(!sb){
      el.authMsg.className = "auth-msg err";
      el.authMsg.textContent = "Connexion au serveur impossible.";
      return;
    }
    el.authSend.disabled = true;
    el.authMsg.className = "auth-msg";
    el.authMsg.textContent = "Envoi en cours";
    sb.auth.signInWithOtp({ email:email, options:{ emailRedirectTo: location.href.split("#")[0] } })
      .then(function(r){
        if(r && r.error) throw r.error;
        el.authMsg.className = "auth-msg ok";
        el.authMsg.textContent = "Lien envoyé. Ouvre ton email et clique dessus.";
      })
      .catch(function(e){
        el.authMsg.className = "auth-msg err";
        el.authMsg.textContent = (e && e.message) || "Échec de l'envoi, réessaie.";
      })
      .then(function(){ el.authSend.disabled = false; });
  }
  function initCloud(){
    renderAccount();
    if(!window.supabase){ setSyncState("local"); return; }
    try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }
    catch(e){ setSyncState("local"); return; }

    el.authSend.addEventListener("click", sendMagicLink);
    el.authEmail.addEventListener("keydown", function(e){ if(e.key === "Enter") sendMagicLink(); });
    el.authSkip.addEventListener("click", function(){ el.authOverlay.style.display = "none"; });

    sb.auth.getSession().then(function(res){
      session = res && res.data ? res.data.session : null;
      renderAccount();
      if(session){ el.authOverlay.style.display = "none"; pullAndMerge(); }
      else { el.authOverlay.style.display = "flex"; setSyncState("local"); }
    }).catch(function(){ setSyncState("local"); });

    sb.auth.onAuthStateChange(function(event, s){
      session = s;
      renderAccount();
      if(event === "SIGNED_IN" && s){
        el.authOverlay.style.display = "none";
        el.authMsg.textContent = ""; el.authEmail.value = "";
        pullAndMerge();
      }
    });
  }

  /* ============ THEME ============ */
  function applyTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("themeIcon").innerHTML = theme === "dark"
      ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
      : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
    try { localStorage.setItem(THEME_KEY, theme); } catch(e){}
  }

  /* ============ EVENEMENTS ============ */

  document.getElementById("newBtn").addEventListener("click", function(){ newNote(); });
  document.getElementById("welcomeBtn").addEventListener("click", function(){ newNote(); });
  document.getElementById("newFolderBtn").addEventListener("click", createFolder);
  document.getElementById("menuBtn").addEventListener("click", function(){ document.body.classList.toggle("collapsed"); });
  document.getElementById("sideClose").addEventListener("click", function(){ document.body.classList.add("collapsed"); });
  el.scrim.addEventListener("click", function(){ document.body.classList.add("collapsed"); });

  document.getElementById("themeBtn").addEventListener("click", function(){
    var t = document.documentElement.getAttribute("data-theme");
    applyTheme(t === "dark" ? "light" : "dark");
    var note = current();
    if(note && note.mode === "map") renderMap();
  });

  el.boardBtn.addEventListener("click", function(){
    var note = current();
    if(!note) return;
    if(note.mode === "board"){
      if(orderingMode) return;
      startMerge(note);
    } else setMode("board");
  });
  el.mapBtn.addEventListener("click", function(){
    var note = current();
    if(!note) return;
    setMode(note.mode === "map" ? "doc" : "map");
  });

  el.notesList.addEventListener("click", function(e){
    var fadd = e.target.closest("[data-fadd]");
    if(fadd){ e.stopPropagation(); newNote(fadd.getAttribute("data-fadd")); return; }
    var fren = e.target.closest("[data-frename]");
    if(fren){ e.stopPropagation(); renameFolder(fren.getAttribute("data-frename")); return; }
    var fdel = e.target.closest("[data-fdel]");
    if(fdel){ e.stopPropagation(); deleteFolder(fdel.getAttribute("data-fdel")); return; }
    var fhead = e.target.closest("[data-fhead]");
    if(fhead){
      var f = folders.filter(function(x){ return x.id===fhead.getAttribute("data-fhead"); })[0];
      if(f){ f.collapsed = !f.collapsed; persistFolders(); renderList(); }
      return;
    }
    var mv = e.target.closest("[data-move]");
    if(mv){ e.stopPropagation(); openMoveMenu(mv.getAttribute("data-move"), mv); return; }
    var del = e.target.closest("[data-del]");
    if(del){ e.stopPropagation(); deleteNote(del.getAttribute("data-del")); return; }
    var item = e.target.closest(".note-item");
    if(item) openNote(item.getAttribute("data-id"));
  });

  var dragId = null;
  el.notesList.addEventListener("dragstart", function(e){
    var item = e.target.closest(".note-item");
    if(!item) return;
    dragId = item.getAttribute("data-id");
    item.classList.add("drag");
    try { e.dataTransfer.setData("text/plain", dragId); } catch(err){}
  });
  el.notesList.addEventListener("dragend", function(){
    dragId = null;
    Array.prototype.forEach.call(el.notesList.querySelectorAll(".drag"), function(n){ n.classList.remove("drag"); });
    Array.prototype.forEach.call(el.notesList.querySelectorAll(".drop"), function(n){ n.classList.remove("drop"); });
  });
  el.notesList.addEventListener("dragover", function(e){
    var head = e.target.closest("[data-fhead]");
    if(!head || !dragId) return;
    e.preventDefault(); head.classList.add("drop");
  });
  el.notesList.addEventListener("dragleave", function(e){
    var head = e.target.closest("[data-fhead]");
    if(head) head.classList.remove("drop");
  });
  el.notesList.addEventListener("drop", function(e){
    var head = e.target.closest("[data-fhead]");
    if(!head || !dragId) return;
    e.preventDefault(); head.classList.remove("drop");
    moveNote(dragId, head.getAttribute("data-fhead"));
    dragId = null;
  });

  el.backlinks.addEventListener("click", function(e){
    var tag = e.target.closest("[data-id]");
    if(tag) openNote(tag.getAttribute("data-id"));
  });

  el.title.addEventListener("input", function(){
    var note = current();
    if(!note) return;
    note.title = el.title.value;
    touch(note); renderList();
    if(note.mode === "map") renderMap();
  });
  el.title.addEventListener("blur", function(){
    var note = current();
    if(!note) return;
    if(note.mode === "doc") renderLinksIn(el.editor);
    renderBacklinks();
  });
  el.subtitle.addEventListener("input", function(){
    var note = current();
    if(!note) return;
    note.subtitle = el.subtitle.value;
    autoGrow(); touch(note); renderList();
  });

  attachEditorEvents(el.editor, persistDoc);
  el.search.addEventListener("input", renderList);

  // barre d'outils : mousedown pour ne pas perdre la selection
  Array.prototype.forEach.call(document.querySelectorAll("#fmtGroup [data-cmd],#fmtGroup [data-block]"), function(btn){
    btn.addEventListener("mousedown", function(e){
      e.preventDefault();
      if(!activeEditor) return;
      activeEditor.focus();
      if(btn.getAttribute("data-cmd")) document.execCommand(btn.getAttribute("data-cmd"), false, null);
      else {
        var tag = btn.getAttribute("data-block");
        document.execCommand("formatBlock", false, currentBlockTag() === tag ? "p" : tag);
      }
      fireInput();
    });
  });
  document.getElementById("checkBtn").addEventListener("mousedown", function(e){
    e.preventDefault();
    if(!activeEditor) return;
    activeEditor.focus(); toggleChecklist(); fireInput();
  });
  el.colorBtn.addEventListener("mousedown", function(e){
    e.preventDefault();
    if(!activeEditor) return;
    activeEditor.focus(); toggleColorSwitch(); fireInput();
  });
  el.hlBtn.addEventListener("mousedown", function(e){
    e.preventDefault();
    saveRange();
    var willOpen = !el.palette.classList.contains("open");
    el.palette.classList.toggle("open");
    if(willOpen){
      var r = el.hlBtn.getBoundingClientRect();
      var left = Math.max(8, Math.min(r.left + r.width/2 - 110, window.innerWidth - 228));
      el.palette.style.left = left + "px";
      el.palette.style.top = (r.bottom + 6) + "px";
    }
  });
  el.palette.addEventListener("mousedown", function(e){
    var sw = e.target.closest(".swatch");
    if(!sw) return;
    e.preventDefault();
    applyHighlight(sw.getAttribute("data-color"));
    el.palette.classList.remove("open");
  });

  // carte mentale
  el.mapCanvas.addEventListener("click", function(e){
    var add = e.target.closest("[data-add]");
    if(add){ e.preventDefault(); addChild(add.getAttribute("data-add")); return; }
    var tog = e.target.closest("[data-toggle]");
    if(tog){
      e.preventDefault();
      var found = findNode(tog.getAttribute("data-toggle"));
      if(found){ found.node.collapsed = !found.node.collapsed; saveMap(); renderMap(); }
      return;
    }
    var host = e.target.closest("[data-node]");
    if(host){
      selectedNodeId = host.getAttribute("data-node");
      Array.prototype.forEach.call(el.mapCanvas.querySelectorAll(".mnode"), function(n){
        n.classList.toggle("sel", n.getAttribute("data-node") === selectedNodeId);
      });
      renderBranchBar();
    }
  });
  el.mapCanvas.addEventListener("input", function(e){
    var span = e.target.closest("[data-edit]");
    if(!span) return;
    var id = span.getAttribute("data-edit"), note = current();
    if(!note) return;
    if(id === "__root__"){
      note.title = span.textContent;
      el.title.value = note.title;
      touch(note); renderList();
      return;
    }
    var found = findNode(id);
    if(found){ found.node.text = span.textContent; saveMap(); }
  });
  el.mapCanvas.addEventListener("keydown", function(e){
    var span = e.target.closest("[data-edit]");
    if(!span) return;
    var id = span.getAttribute("data-edit");
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      if(id === "__root__") addChild("__root__"); else addSibling(id);
      return;
    }
    if(e.key === "Tab" && !e.shiftKey){ e.preventDefault(); addChild(id); return; }
    if(e.key === "Tab" && e.shiftKey){ e.preventDefault(); if(id !== "__root__") outdentNode(id); return; }
    if(e.key === "Backspace" && span.textContent === "" && id !== "__root__"){
      e.preventDefault();
      var found = findNode(id);
      var back = found && found.index > 0 ? found.siblings[found.index-1].id
               : (found && found.parent ? found.parent.id : null);
      removeNode(id);
      if(back) focusNode(back);
      return;
    }
    if(e.key === "Escape") span.blur();
  });
  el.branchBar.addEventListener("click", function(e){
    var dot = e.target.closest("[data-color]");
    if(!dot) return;
    var branch = branchOf(selectedNodeId);
    if(!branch) return;
    branch.color = dot.getAttribute("data-color");
    saveMap(); renderMap();
  });

  /* ---- panneau plan ---- */
  el.outlineBtn.addEventListener("click", function(){ setOutline(!outlineOn); });

  el.outline.addEventListener("click", function(e){
    var add = e.target.closest("[data-oladd]");
    if(add){ e.stopPropagation(); addChild(add.getAttribute("data-oladd")); return; }
    var car = e.target.closest("[data-olt]");
    if(car){
      e.stopPropagation();
      var f = findNode(car.getAttribute("data-olt"));
      if(f){ f.node.collapsed = !f.node.collapsed; saveMap(); renderMap(); }
      return;
    }
    var row = e.target.closest("[data-ol]");
    if(row) focusNode(row.getAttribute("data-ol"));
  });

  /* ---- glisser pour ranger ailleurs ---- */
  var dragNodeId = null;

  function clearDropMarks(){
    Array.prototype.forEach.call(
      document.querySelectorAll(".drop-before,.drop-after,.drop-into"), function(n){
        n.classList.remove("drop-before","drop-after","drop-into");
      });
  }

  // dans le plan : le tiers haut range avant, le tiers bas apres, le milieu dedans
  function dropPosition(row, e){
    var r = row.getBoundingClientRect();
    var p = (e.clientY - r.top) / r.height;
    if(p < 0.3) return "before";
    if(p > 0.7) return "after";
    return "into";
  }

  el.outline.addEventListener("dragstart", function(e){
    var row = e.target.closest("[data-ol]");
    if(!row) return;
    dragNodeId = row.getAttribute("data-ol");
    row.classList.add("dragging");
    try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragNodeId); } catch(err){}
  });
  el.outline.addEventListener("dragend", function(){
    dragNodeId = null;
    Array.prototype.forEach.call(el.outline.querySelectorAll(".dragging"), function(n){ n.classList.remove("dragging"); });
    clearDropMarks();
  });
  el.outline.addEventListener("dragover", function(e){
    var row = e.target.closest("[data-ol]");
    if(!row || !dragNodeId) return;
    var id = row.getAttribute("data-ol");
    if(id === dragNodeId || isDescendant(dragNodeId, id)) return;
    e.preventDefault();
    clearDropMarks();
    row.classList.add("drop-" + dropPosition(row, e));
  });
  el.outline.addEventListener("dragleave", function(e){
    var row = e.target.closest("[data-ol]");
    if(row) row.classList.remove("drop-before","drop-after","drop-into");
  });
  el.outline.addEventListener("drop", function(e){
    var row = e.target.closest("[data-ol]");
    if(!row || !dragNodeId) return;
    e.preventDefault();
    var pos = dropPosition(row, e);
    clearDropMarks();
    moveNodeTo(dragNodeId, row.getAttribute("data-ol"), pos);
    dragNodeId = null;
  });

  // sur la carte : deposer un noeud sur un autre en fait une sous-idee
  el.mapCanvas.addEventListener("dragstart", function(e){
    var host = e.target.closest("[data-node]");
    if(!host || host.getAttribute("data-node") === "__root__") return;
    dragNodeId = host.getAttribute("data-node");
    try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragNodeId); } catch(err){}
  });
  el.mapCanvas.addEventListener("dragend", function(){ dragNodeId = null; clearDropMarks(); });
  el.mapCanvas.addEventListener("dragover", function(e){
    var host = e.target.closest("[data-node]");
    if(!host || !dragNodeId) return;
    var id = host.getAttribute("data-node");
    if(id === dragNodeId || (id !== "__root__" && isDescendant(dragNodeId, id))) return;
    e.preventDefault();
    clearDropMarks();
    host.classList.add("drop-into");
  });
  el.mapCanvas.addEventListener("drop", function(e){
    var host = e.target.closest("[data-node]");
    if(!host || !dragNodeId) return;
    e.preventDefault();
    clearDropMarks();
    var id = host.getAttribute("data-node");
    if(id === "__root__"){
      // depose sur le titre : le noeud remonte en branche principale
      var note = current(), src = findNode(dragNodeId);
      if(note && src){
        src.siblings.splice(src.index, 1);
        note.map.children.push(src.node);
        if(!src.node.color) src.node.color = BRANCH_COLORS[(note.map.children.length-1) % BRANCH_COLORS.length].id;
        saveMap(); renderMap();
      }
    } else {
      moveNodeTo(dragNodeId, id, "into");
    }
    dragNodeId = null;
  });

  document.addEventListener("mousedown", function(e){
    if(ac && !e.target.closest(".ac")) closeAutocomplete();
    if(!e.target.closest(".hl-wrap") && !e.target.closest("#palette")) el.palette.classList.remove("open");
  });
  window.addEventListener("resize", function(){
    if(ac) positionAutocomplete();
    if(window.innerWidth > 820) document.body.classList.remove("collapsed");
  });
  document.addEventListener("keydown", function(e){
    var mod = e.metaKey || e.ctrlKey;
    if(mod && e.key.toLowerCase() === "n"){ e.preventDefault(); newNote(); }
    if(mod && e.key.toLowerCase() === "f"){
      e.preventDefault();
      document.body.classList.remove("collapsed");
      el.search.focus();
    }
  });

  /* ============ DEMARRAGE ============ */
  var savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch(e){}
  applyTheme(savedTheme === "dark" ? "dark" : "light");
  el.hlSwatch.style.background = hlColor;
  var savedOutline = null;
  try { savedOutline = localStorage.getItem("notes.app.outline"); } catch(e){}
  setOutline(savedOutline === "1");

  load();
  saveLocalOnly(); // la migration est ecrite tout de suite, pas au premier changement
  if(window.innerWidth > 820) document.body.classList.remove("collapsed");
  renderList();

  if(notes.length) openNote(notes.slice().sort(function(a,b){ return b.updated-a.updated; })[0].id);
  else { el.area.style.display = "none"; el.welcome.style.display = "flex"; }

  initCloud();
})();
</script>

</body>
</html>
