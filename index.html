<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ThinkOS</title>
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ThinkOS">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  html[data-theme="light"]{
    --bg:#FBFAF8; --card:#FFFFFF; --ink:#1C1B19; --muted:#6E6B60; --faint:#8F8B80;
    --line:#E8E6E0; --accent:#4F46E5; --accent-soft:#EEEBFF; --hover:rgba(0,0,0,.045);
    --shadow:0 4px 16px rgba(0,0,0,.10); --wine:#B0405C; --danger:#E5484D; --ok:#22A06B;
    --dot:#E2E0DA;
  }
  html[data-theme="dark"]{
    --bg:#100F0E; --card:#1B1A18; --ink:#F3F1ED; --muted:#9A948B; --faint:#6E6960;
    --line:#2B2A26; --accent:#8B85FF; --accent-soft:#26234A; --hover:rgba(255,255,255,.06);
    --shadow:0 4px 18px rgba(0,0,0,.55); --wine:#E0788F; --danger:#F06E72; --ok:#4CC38A;
    --dot:#2B2A26;
  }

  html{
    font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px; -webkit-text-size-adjust:100%;
  }
  body{background:var(--bg);color:var(--ink);height:100vh;height:100dvh;display:flex;overflow:hidden}
  button{font-family:inherit}

  /* ============ SIDEBAR ============ */
  .sidebar{
    width:284px;flex-shrink:0;border-right:1px solid var(--line);
    display:flex;flex-direction:column;background:var(--bg);z-index:20;
  }
  .side-head{padding:16px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand{font-weight:700;font-size:15px;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .side-head-actions{display:flex;gap:2px}
  .side-close{display:none}
  .side-body{padding:0 10px 10px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}

  .btn{
    padding:9px 12px;background:var(--accent);color:#fff;border:none;border-radius:9px;
    cursor:pointer;font-size:13px;font-weight:600;
  }
  .btn:hover{filter:brightness(1.08)}

  .search-wrap{position:relative;display:flex;align-items:center}
  .search-wrap svg{position:absolute;left:10px;width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:2;pointer-events:none}
  .search{
    padding:9px 11px 9px 30px;background:var(--hover);border:1px solid var(--line);border-radius:9px;
    outline:none;width:100%;font-size:13px;color:var(--ink);font-family:inherit;
  }
  .search:focus{border-color:var(--accent)}
  .search::placeholder{color:var(--faint)}

  .notes-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;margin:0 -4px;padding:0 4px}

  .note-item{
    position:relative;padding:9px 32px 9px 10px;border-radius:9px;cursor:pointer;
    border-left:3px solid transparent;transition:background .12s;
  }
  .note-item:hover{background:var(--hover)}
  .note-item.active{background:var(--accent-soft);border-left-color:var(--accent)}
  .note-title{
    font-weight:600;font-size:13px;margin-bottom:2px;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .note-snippet{
    font-size:11.5px;color:var(--muted);line-height:1.35;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .note-date{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--faint);margin-top:3px}
  .mode-badge{
    display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;vertical-align:middle;
    background:var(--accent-soft);color:var(--accent);
    font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  }
  .note-actions{
    position:absolute;right:5px;top:8px;display:flex;gap:1px;opacity:0;transition:opacity .12s;
  }
  .note-item:hover .note-actions{opacity:1}
  .mini{
    width:24px;height:24px;border:none;background:transparent;color:var(--faint);
    border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .mini:hover{color:var(--ink);background:var(--hover)}
  .mini svg{width:13px;height:13px;stroke-width:2;fill:none;stroke:currentColor}
  .note-item [data-del]:hover{color:var(--danger)}
  .note-item.drag{opacity:.45}
  .empty-hint{padding:20px 10px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
  .empty-hint.small{padding:8px 10px;font-size:11px}

  /* ---- dossiers ---- */
  .folder{margin-bottom:1px}
  .folder-head{
    display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;
    cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);
  }
  .folder-head:hover{background:var(--hover)}
  .folder-head.drop{background:var(--accent-soft);color:var(--accent)}
  .fcaret{display:flex;flex-shrink:0;transition:transform .15s}
  .fcaret svg{width:13px;height:13px;stroke-width:2.4;fill:none;stroke:currentColor}
  .fcaret.open{transform:rotate(90deg)}
  .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fcount{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--faint)}
  .f-actions{display:none;gap:1px}
  .folder-head:hover .f-actions{display:flex}
  .folder-head:hover .fcount{display:none}
  .folder-body{padding-left:8px;border-left:1px solid var(--line);margin-left:13px}

  .move-menu{
    position:fixed;background:var(--card);border:1px solid var(--line);border-radius:11px;
    box-shadow:var(--shadow);padding:5px;z-index:400;min-width:180px;max-height:280px;overflow-y:auto;
  }
  .mm-row{padding:8px 11px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink)}
  .mm-row:hover{background:var(--accent-soft);color:var(--accent)}
  .mm-row.new{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;color:var(--muted)}

  /* ---- compte ---- */
  .account-bar{
    flex-shrink:0;border-top:1px solid var(--line);padding:10px 14px;
    display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);
  }
  .acc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .acc-dot.on{background:var(--ok)}
  .acc-dot.off{background:var(--faint)}
  .acc-mail{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acc-btn{
    border:none;background:transparent;color:var(--accent);cursor:pointer;
    font-size:11.5px;font-weight:600;padding:2px 4px;border-radius:5px;
  }
  .acc-btn:hover{background:var(--accent-soft)}

  /* ============ MAIN ============ */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .toolbar{
    height:52px;flex-shrink:0;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:3px;padding:0 10px;
  }
  .tb-scroll{
    flex:1;min-width:0;display:flex;align-items:center;gap:2px;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  }
  .tb-scroll::-webkit-scrollbar{display:none}
  .tb-right{display:flex;align-items:center;gap:6px;flex-shrink:0;padding-left:6px}
  .tbtn{
    width:34px;height:34px;border:none;background:transparent;color:var(--ink);
    border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;flex-shrink:0;
  }
  .tbtn:hover{background:var(--hover)}
  .tbtn.on{background:var(--accent-soft);color:var(--accent)}
  .tbtn svg{width:17px;height:17px;stroke-width:2;fill:none;stroke:currentColor}
  .tbtn.muted{color:var(--muted)}
  .tb-menu{display:none}
  .divider{width:1px;height:20px;background:var(--line);margin:0 5px;flex-shrink:0}

  .sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .sync-dot.local{background:var(--faint)}
  .sync-dot.syncing{background:#E0A44E;animation:sync-pulse .9s ease-in-out infinite}
  .sync-dot.synced{background:var(--ok)}
  @keyframes sync-pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---- en-tete de note ---- */
  .editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .note-head{padding:26px 40px 0;flex-shrink:0;border-bottom:1px solid var(--line)}
  .title-input{
    width:100%;font-family:inherit;font-size:26px;font-weight:700;letter-spacing:-.025em;
    border:none;background:transparent;outline:none;color:var(--ink);margin-bottom:7px;
  }
  .title-input::placeholder{color:var(--faint)}
  .subtitle-input{
    width:100%;font-family:inherit;font-size:13px;color:var(--muted);line-height:1.5;
    border:none;background:transparent;outline:none;resize:none;overflow:hidden;margin-bottom:13px;
  }
  .subtitle-input::placeholder{color:var(--faint)}
  .backlinks{font-size:11px;padding-bottom:13px;display:none}
  .backlinks.on{display:block}
  .bl-label{
    display:block;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .bl-tag{
    display:inline-block;background:var(--accent-soft);color:var(--accent);
    padding:3px 9px;border-radius:6px;margin:0 6px 6px 0;cursor:pointer;
    font-size:11.5px;font-weight:600;
  }
  .bl-tag:hover{background:var(--accent);color:#fff}

  /* ---- mode texte ---- */
  .doc-pane{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:0 40px}
  .editor{
    max-width:680px;width:100%;outline:none;padding:28px 0 40vh;
    font-family:"Source Serif 4",Georgia,serif;font-size:17.5px;line-height:1.75;
    color:var(--ink);word-wrap:break-word;
  }
  .editor.is-empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
  .editor h1{font-family:inherit;font-size:26px;line-height:1.3;margin:30px 0 12px;font-weight:700;letter-spacing:-.015em}
  .editor h2{font-family:inherit;font-size:20px;line-height:1.35;margin:26px 0 10px;font-weight:600}
  .editor p{margin-bottom:15px}
  .editor blockquote{
    border-left:3px solid var(--accent);padding-left:16px;margin:16px 0;
    color:var(--muted);font-style:italic;
  }
  .editor ul,.editor ol{margin:12px 0 16px;padding-left:24px}
  .editor li{margin:.28em 0}
  .editor li.empty,.editor li.spacer{list-style:none;min-height:1.1em}
  .editor mark{border-radius:3px;padding:.02em .12em}
  .editor a.note-link{
    color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer;
  }
  .editor a.note-link:hover{filter:brightness(1.15)}
  .editor a.note-link.broken{color:var(--faint);text-decoration-style:dotted}

  /* checklist */
  .editor ul.checklist{list-style:none;padding-left:2px}
  .editor ul.checklist li{position:relative;padding-left:32px;margin:.32em 0;list-style:none}
  .editor ul.checklist li::before{
    content:"";position:absolute;left:0;top:.3em;
    width:19px;height:19px;border:2px solid var(--faint);border-radius:6px;
    cursor:pointer;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#fff;line-height:1;
    transition:background .12s ease,border-color .12s ease;
  }
  .editor ul.checklist li.done::before{content:"\2713";background:var(--accent);border-color:var(--accent)}
  .editor ul.checklist li.done{color:var(--muted);text-decoration:line-through}

  /* palettes */
  .hl-wrap{position:relative;display:flex}
  .hl-swatch{
    position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
    width:15px;height:3px;border-radius:2px;background:#FFE27A;pointer-events:none;
  }
  .palette{
    position:fixed;top:0;left:0;background:var(--card);border:1px solid var(--line);
    border-radius:13px;box-shadow:var(--shadow);padding:10px;display:none;
    grid-template-columns:repeat(4,1fr);gap:7px;z-index:300;
  }
  .palette.open{display:grid}
  .swatch{
    width:28px;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,.08);cursor:pointer;
  }
  html[data-theme="dark"] .swatch{border-color:rgba(255,255,255,.14)}
  .swatch:hover{transform:scale(1.08)}
  .swatch.clear{
    background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;
    border-style:dashed;
  }
  .swatch.clear svg{width:14px;height:14px;stroke-width:2;fill:none;stroke:currentColor}

  .color-switch{gap:4px}
  .cs-dot{
    width:12px;height:12px;border-radius:50%;border:1.5px solid transparent;box-sizing:border-box;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .cs-dot.ink{background:var(--ink)}
  .cs-dot.wine{background:var(--wine)}
  .cs-dot.active{transform:scale(1.25);border-color:var(--card);box-shadow:0 0 0 1.5px currentColor}
  .cs-dot.ink.active{color:var(--ink)}
  .cs-dot.wine.active{color:var(--wine)}

  /* ---- mode tableau ---- */
  .board-pane{flex:1;overflow:auto;position:relative}
  .canvas{
    position:relative;width:3000px;height:2200px;
    background-image:radial-gradient(var(--dot) 1px,transparent 1px);
    background-size:24px 24px;
  }
  .canvas-hint{
    position:absolute;top:40px;left:40px;font-size:13px;color:var(--faint);pointer-events:none;
  }
  .block{
    position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:2px;min-height:44px;
  }
  .block.dragging{opacity:.85;z-index:50}
  .block .editor{
    max-width:none;padding:10px 12px;font-size:16px;line-height:1.6;
  }
  .block-grip{
    position:absolute;top:-11px;left:8px;width:26px;height:20px;border-radius:6px;
    background:var(--card);border:1px solid var(--line);color:var(--faint);cursor:grab;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s;
  }
  .block-grip svg{width:15px;height:15px}
  .block-del{
    position:absolute;top:-11px;right:8px;width:20px;height:20px;border-radius:50%;
    background:var(--card);border:1px solid var(--line);color:var(--faint);cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s;
  }
  .block-del svg{width:11px;height:11px}
  .block-del:hover{color:var(--danger);border-color:var(--danger)}
  .block:hover .block-grip,.block:hover .block-del{opacity:1}
  .block-resize{
    position:absolute;top:0;right:-3px;width:8px;height:100%;cursor:ew-resize;
  }

  .order-bubble{
    position:absolute;top:-12px;left:-12px;z-index:6;width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
    background:var(--card);border:1.5px solid var(--faint);color:var(--faint);box-shadow:var(--shadow);
  }
  .order-bubble.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .order-cover{position:absolute;inset:0;z-index:5;cursor:pointer;border-radius:12px}
  .board-pane.ordering .block{cursor:pointer}
  .board-pane.ordering .block-grip,
  .board-pane.ordering .block-del,
  .board-pane.ordering .block-resize{display:none!important}
  .merge-bar{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:320;
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:10px 14px;font-size:13px;color:var(--muted);
    max-width:calc(100vw - 24px);text-align:center;
  }
  .merge-bar span{flex:1 1 auto;min-width:180px}
  .merge-bar .mb-btn{padding:8px 15px;border-radius:9px;font-weight:600;font-size:13px;border:none;cursor:pointer}
  .merge-bar .mb-go{background:var(--accent);color:#fff}
  .merge-bar .mb-cancel{background:transparent;color:var(--muted)}
  .merge-bar .mb-cancel:hover{color:var(--ink)}

  /* ---- mode carte ---- */
  .map-pane{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .map-body{flex:1;display:flex;min-height:0}
  .map-scroll{
    flex:1;min-width:0;overflow:auto;
    background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:24px 24px;
  }

  /* ---- panneau plan ---- */
  .outline{
    width:300px;flex-shrink:0;border-left:1px solid var(--line);
    overflow-y:auto;padding:8px 8px 60px;background:var(--bg);display:none;
  }
  .outline.on{display:block}
  .ol-head{
    padding:4px 8px 10px;font-size:9.5px;font-weight:700;
    letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  }
  .ol-row{
    position:relative;display:flex;align-items:center;gap:5px;
    padding:6px 4px;border-radius:7px;cursor:pointer;font-size:13px;
    margin-left:calc(var(--d) * 15px);
  }
  .ol-row:hover{background:var(--hover)}
  .ol-row.sel{background:var(--accent-soft)}
  .ol-row.dragging{opacity:.4}
  .ol-rail{width:3px;height:16px;border-radius:2px;background:var(--oc);flex-shrink:0}
  .ol-caret{
    width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);transition:transform .15s;
  }
  .ol-caret svg{width:11px;height:11px;stroke-width:2.6;fill:none;stroke:currentColor}
  .ol-caret.open{transform:rotate(90deg)}
  .ol-caret.leaf{visibility:hidden}
  .ol-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  .ol-row.d0 .ol-text{font-weight:600}
  .ol-text.vide{color:var(--faint);font-style:italic}
  .ol-count{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--faint)}
  .ol-add{
    width:22px;height:22px;border:none;background:transparent;color:var(--faint);
    border-radius:6px;cursor:pointer;font-size:15px;line-height:1;padding:0;
    display:none;align-items:center;justify-content:center;flex-shrink:0;
  }
  .ol-row:hover .ol-add{display:flex}
  .ol-row:hover .ol-count{display:none}
  .ol-add:hover{background:var(--hover);color:var(--ink)}
  /* reperes de depot */
  .ol-row.drop-before::before,.ol-row.drop-after::after{
    content:"";position:absolute;left:0;right:4px;height:2px;
    background:var(--accent);border-radius:2px;
  }
  .ol-row.drop-before::before{top:-1px}
  .ol-row.drop-after::after{bottom:-1px}
  .ol-row.drop-into{box-shadow:inset 0 0 0 2px var(--accent)}
  .ol-empty{padding:14px 10px;font-size:12px;color:var(--muted);line-height:1.5}
  @media(max-width:820px){
    .outline{
      position:absolute;top:0;right:0;bottom:0;width:min(290px,84vw);
      z-index:25;box-shadow:var(--shadow);
    }
  }
  .map-canvas{position:relative}
  .mlines{position:absolute;top:0;left:0;pointer-events:none}
  .mnode{
    position:absolute;display:flex;align-items:center;gap:6px;padding:0 12px;
    border-radius:10px;background:var(--card);border:1.5px solid var(--nc);
    box-shadow:var(--shadow);font-size:14px;font-weight:500;color:var(--ink);
  }
  .mnode.root{font-weight:700;background:var(--nc);border-color:var(--nc);color:#fff}
  html[data-theme="dark"] .mnode.root{color:#12110F}
  .mnode.sel{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
  /* un span est un element en ligne : min-width y est ignore et un noeud vide
     ferait 0px de large, sans zone ou poser le curseur. inline-block corrige. */
  .mtext{
    display:inline-block;outline:none;white-space:nowrap;line-height:1.2;
    min-width:58px;min-height:1.25em;
  }
  .mtext:empty::before{content:"Idée";color:var(--faint)}
  .mnode.root .mtext:empty::before{color:rgba(255,255,255,.65)}
  .mtoggle{
    width:20px;height:20px;flex-shrink:0;border-radius:50%;cursor:pointer;
    border:1.5px solid var(--nc);background:var(--card);color:var(--nc);
    font-size:11px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .mtoggle:hover{background:var(--nc);color:var(--card)}
  /* bouton visible pour ajouter une sous-idee sans passer par le clavier */
  .madd{
    position:absolute;right:-13px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;cursor:pointer;z-index:4;padding:0;
    border:1.5px solid var(--nc);background:var(--card);color:var(--nc);
    font-size:16px;font-weight:600;line-height:1;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .12s,background .12s,color .12s;
  }
  .mnode:hover .madd,.mnode.sel .madd{opacity:1}
  .madd:hover{background:var(--nc);color:var(--card)}
  .mnode.drop-into{box-shadow:0 0 0 3px var(--accent)}
  @media (hover:none){ .madd{opacity:1} }
  .map-hint{
    flex-shrink:0;padding:8px 16px;font-size:11px;color:var(--muted);
    border-top:1px solid var(--line);text-align:center;
  }
  .map-hint b{color:var(--muted);font-weight:600}
  .branch-bar{
    display:none;position:absolute;left:50%;bottom:52px;transform:translateX(-50%);
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:8px 12px;align-items:center;gap:8px;z-index:30;
  }
  .branch-bar.on{display:flex}
  /* recentre la barre sur la carte quand le plan occupe la droite */
  .map-pane.with-outline .branch-bar{margin-left:-150px}
  @media(max-width:820px){ .map-pane.with-outline .branch-bar{margin-left:0} }
  .bb-label{font-size:11px;color:var(--muted);font-weight:600;margin-right:2px}
  .bb-dot{
    width:20px;height:20px;border-radius:50%;border:2px solid transparent;
    cursor:pointer;padding:0;transition:transform .12s;
  }
  .bb-dot:hover{transform:scale(1.15)}
  .bb-dot.on{border-color:var(--ink);transform:scale(1.15)}

  /* ---- autocomplete ---- */
  .ac{
    position:fixed;background:var(--card);border:1px solid var(--line);border-radius:11px;
    box-shadow:var(--shadow);padding:5px;z-index:400;min-width:190px;max-width:280px;
    max-height:240px;overflow-y:auto;
  }
  .ac-item{
    padding:8px 11px;border-radius:7px;font-size:13px;color:var(--ink);cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ac-item:hover,.ac-item.sel{background:var(--accent-soft);color:var(--accent)}

  /* ---- accueil et connexion ---- */
  .welcome{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
  .welcome h2{font-size:22px;font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
  .welcome p{color:var(--muted);font-size:14px;line-height:1.6;max-width:340px;margin-bottom:20px}

  .auth-overlay{
    position:fixed;inset:0;background:var(--bg);z-index:500;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .auth-card{width:100%;max-width:360px;text-align:center}
  .auth-card .brand{justify-content:center;font-size:18px;margin-bottom:10px}
  .auth-sub{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:22px}
  .auth-input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
    background:var(--card);color:var(--ink);font-size:14px;font-family:inherit;
    outline:none;margin-bottom:10px;
  }
  .auth-input:focus{border-color:var(--accent)}
  .auth-send{width:100%;padding:11px}
  .auth-msg{font-size:12px;margin-top:12px;min-height:16px;line-height:1.5}
  .auth-msg.ok{color:var(--ok)}
  .auth-msg.err{color:var(--danger)}
  .auth-skip{
    margin-top:18px;border:none;background:transparent;color:var(--muted);
    font-size:12px;cursor:pointer;text-decoration:underline;
  }
  .auth-skip:hover{color:var(--ink)}

  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:15}

  /* repere visible pour la navigation au clavier */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  .note-item:focus-visible,.folder-head:focus-visible{outline-offset:-2px}

  /* ============ RESPONSIVE ============ */
  @media(max-width:820px){
    .sidebar{
      position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);
      transform:translateX(0);transition:transform .22s ease;box-shadow:var(--shadow);
    }
    body.collapsed .sidebar{transform:translateX(-100%)}
    body:not(.collapsed) .scrim{display:block}
    .side-close{display:flex}
    .tb-menu{display:flex}

  @media(max-width:480px){

  @media (hover:none){
    .note-actions{opacity:1}
    .f-actions{display:flex}
    .folder-head .fcount{display:none}
    .block-grip,.block-del{opacity:1}
  }
</style>
</head>
